name: Build FolkPatch

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'apd/**'
      - 'fpd/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'apd/**'
      - 'fpd/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build_release:
    name: Build Release
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env

      - name: Verify version
        run: ./gradlew printVersion --no-daemon

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > FolkPatch.jks

      - name: Create keystore.properties
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cat > keystore.properties << 'EOF'
          KEYSTORE_FILE=../FolkPatch.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      # 無簽名 secret 時不寫 keystore.properties，
      # build.gradle.kts 的 release signingConfig 會 fallback 到 debug.keystore
      # （android/androiddebugkey），照樣出可安裝的 release APK。
      - run: ./gradlew assembleRelease --no-daemon

      - name: APK location
        run: find app/build/outputs -name "*.apk" -type f || echo "No APK found"

      - name: Rename APK
        run: |
          SHORT="${GITHUB_SHA::7}"
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          [ -n "$APK" ] && mv "$APK" "FolkPatch-Release-${SHORT}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: folkpatch-release-${{ github.sha }}
          path: FolkPatch-Release-*.apk
          retention-days: 30

  upload:
    name: Upload to Telegram
    needs: [build_release]
    if: always() && needs.build_release.result == 'success' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram config
        id: tg_check
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Telegram secrets not configured, skipping upload"
          fi

      - name: Download artifacts
        if: steps.tg_check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: folkpatch-*
          path: artifacts
          merge-multiple: true

      - name: Send to Telegram
        if: steps.tg_check.outputs.enabled == 'true'
        run: |
          FILES=$(find artifacts -type f 2>/dev/null | sort)
          FILE_COUNT=$(echo "$FILES" | grep -c . || true)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No files found in artifacts"
            exit 1
          fi

          CAPTION="${{ github.event.head_commit.message }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.event.head_commit.author.name }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "document=@$FILES" \
            -F "caption=${CAPTION}"
